name: Deploy to GitHub Pages

# Deploy ONLY from the main branch. main = production.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress prod deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build metadata
        run: |
          echo "{\"sha\": \"${GITHUB_SHA}\", \"built_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"ref\": \"${GITHUB_REF_NAME}\"}" > build.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repo root (static site, no build step needed).
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
